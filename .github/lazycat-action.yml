version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/bitcomet.lpk

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: bitcomet

build:
  run_buildscript: false

images:
  - id: bitcomet
    target: service
    service: sandbox
    source: wxhere/bitcomet-webui
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    application:
      language: zh
      name: BitComet
      source: https://www.bitcomet.com/index.htm
      source_author: bitcomet
  private:
    enabled: true
    skip_if_version_exists: true
    name: BitComet
    summary: 比特彗星的 LazyCat 自动构建版本

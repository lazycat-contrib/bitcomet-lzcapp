name: BitComet
package: cloud.lazycat.app.bitcomet
version: 2.17.0
min_os_version: 1.3.8
description: BitComet(比特彗星)是一款免费的BT/HTTP/FTP下载软件！功能强大速度快，操作简单的BT下载软件，BT资源下载利器！
homepage: https://www.bitcomet.com/index.htm
author: bitcomet
application:
  subdomain: bitcomet
  background_task: true
  multi_instance: true
  file_handler:
    mime:
      - application/x-magnet
      - application/x-bittorrent
    actions:
      open: /open?file=%u
  public_path:
    - /
  routes:
    - /=http://sandbox:8080/
  ingress:
    - protocol: udp
      port: 6082
      service: sandbox
    - protocol: tcp
      port: 6082
      service: sandbox
services:
  sandbox:
    # wxhere/bitcomet-webui:v2.17.0
    image: registry.lazycat.cloud/czyt/wxhere/bitcomet-webui:64cadcd3fbdfdfaf
    environment:
      - BITCOMET_WEBUI_PORT=8080
      - BITCOMET_BT_PORT=6082
      - WEBUI_USERNAME={{ .U.admin_username }}
      - WEBUI_PASSWORD={{.U.admin_password }}
    binds:
      - /lzcapp/var/BitComet:/root/.config/BitComet
      - /lzcapp/document/下载:/root/Downloads

ext_config:
  enable_document_access: true
  enable_media_access: true

locales:
  zh:
    name: "比特彗星"
    description: "比特彗星(BitComet)是一款免费的BT/HTTP/FTP下载软件！功能强大速度快，操作简单的BT下载软件，BT资源下载利器！"
  en:
    name: "BitComet"
    description: "BitComet is a free BitTorrent download client!BitComet is powerful, super-fast and easy-to-use."
